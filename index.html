<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PianoMagic</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }
        h1 { margin-top: 40px; font-size: 2rem; letter-spacing: -0.5px; }
        .subtitle { color: #a0a0c0; margin: 8px 0 32px; font-size: 0.95rem; }
        .drop-zone {
            width: 100%;
            max-width: 480px;
            height: 180px;
            border: 2px dashed #00d4aa;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            background: rgba(0, 212, 170, 0.06);
        }
        .drop-zone:active, .drop-zone.dragover {
            background: rgba(0, 212, 170, 0.18);
            transform: scale(0.98);
        }
        .drop-zone input { display: none; }
        .icon { font-size: 2.8rem; margin-bottom: 8px; filter: grayscale(0.2); }
        .hint { font-size: 0.85rem; color: #8080a0; margin-top: 6px; }
        .status {
            margin-top: 28px;
            padding: 20px;
            border-radius: 16px;
            background: rgba(255,255,255,0.06);
            max-width: 480px;
            width: 100%;
            display: none;
            backdrop-filter: blur(10px);
        }
        .status.active { display: block; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 14px;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4aa, #00a8e8);
            width: 0%;
            transition: width 0.4s ease;
        }
        .btn {
            display: inline-block;
            margin-top: 16px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #00d4aa, #00a8e8);
            color: #0f0c29;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .error { color: #ff6b8a; }
        .success { color: #00d4aa; }

        /* Подвал с версиями */
        .footer {
            margin-top: auto;
            padding-top: 40px;
            text-align: center;
            font-size: 0.75rem;
            color: #606080;
            width: 100%;
            max-width: 480px;
        }
        .footer .version-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .footer .version-row span {
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 8px;
            font-family: 'SF Mono', Monaco, monospace;
        }
        .footer .version-row .label { color: #8080a0; }
        .footer .version-row .value { color: #00d4aa; }
        .footer .version-row .value.err { color: #ff6b8a; }
        .footer .cache-hint {
            margin-top: 8px;
            font-size: 0.7rem;
            color: #505070;
        }
    </style>
</head>
<body>
    <h1>🎹 PianoMagic</h1>
    <p class="subtitle">Аудио → Ноты (PDF)</p>

    <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="audio/*">
        <div class="icon">📁</div>
        <div>Перетащите аудиофайл сюда</div>
        <div class="hint">MP3 · WAV · FLAC · M4A · OGG</div>
    </div>

    <div class="status" id="status">
        <div id="statusText">Загрузка...</div>
        <div class="progress-bar" id="progressBar" style="display:none;">
            <div class="fill" id="progressFill"></div>
        </div>
        <div id="actions"></div>
    </div>

    <!-- Подвал с версиями -->
    <div class="footer" id="footer">
        <div class="version-row">
            <span><span class="label">Frontend:</span> <span class="value" id="feVersion">—</span></span>
            <span><span class="label">Backend:</span> <span class="value" id="beVersion">—</span></span>
        </div>
        <div class="cache-hint" id="cacheHint"></div>
    </div>

    <script>
        const API_URL = 'https://pianomagic-api.onrender.com';
        const FE_VERSION = '3.1.0'; // Меняй при каждом обновлении index.html

        // Показываем версию фронтенда сразу
        document.getElementById('feVersion').textContent = FE_VERSION;

        // Запрашиваем версию бэкенда
        fetch(`${API_URL}/`)
            .then(r => r.ok ? r.json() : Promise.reject(r.status))
            .then(data => {
                document.getElementById('beVersion').textContent = data.version || 'unknown';
            })
            .catch(err => {
                document.getElementById('beVersion').textContent = 'offline';
                document.getElementById('beVersion').classList.add('err');
            });

        // Показываем подсказку про кэш
        document.getElementById('cacheHint').textContent = 
            `Build: ${new Date().toISOString().slice(0,19).replace('T',' ')} UTC`;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const actions = document.getElementById('actions');
        let pollInterval;

        dropZone.addEventListener('click', () => fileInput.click());

        ['dragover','dragenter'].forEach(evt => {
            dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        });
        ['dragleave','drop'].forEach(evt => {
            dropZone.addEventListener(evt, e => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (evt === 'drop' && e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            const valid = /\.(mp3|wav|flac|m4a|ogg)$/i.test(file.name) || file.type.startsWith('audio/');
            if (!valid) { alert('Выберите аудиофайл (MP3, WAV, FLAC, M4A, OGG)'); return; }

            status.classList.add('active');
            statusText.textContent = 'Загрузка на сервер...';
            progressBar.style.display = 'block';
            progressFill.style.width = '25%';
            actions.innerHTML = '';

            const formData = new FormData();
            formData.append('file', file);

            fetch(`${API_URL}/transcribe/file`, { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    if (data.job_id) {
                        statusText.textContent = 'ИИ транскрибирует ноты...';
                        progressFill.style.width = '50%';
                        pollStatus(data.job_id);
                    } else throw new Error('Сервер не вернул job_id');
                })
                .catch(err => {
                    statusText.innerHTML = `<span class="error">Ошибка: ${err.message}</span>`;
                    progressBar.style.display = 'none';
                });
        }

        function pollStatus(jobId) {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => {
                fetch(`${API_URL}/status/${jobId}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.status === 'completed') {
                            clearInterval(pollInterval);
                            statusText.innerHTML = '<span class="success">✅ Готово!</span>';
                            progressFill.style.width = '100%';
                            actions.innerHTML = `<a href="${API_URL}/download/${jobId}.pdf" class="btn" download>Скачать ноты (PDF)</a>`;
                        } else if (data.status === 'failed') {
                            clearInterval(pollInterval);
                            statusText.innerHTML = `<span class="error">❌ Ошибка при обработке</span>`;
                            progressBar.style.display = 'none';
                        } else {
                            progressFill.style.width = (55 + Math.random() * 30) + '%';
                        }
                    });
            }, 3000);
        }
    </script>
</body>
</html>
