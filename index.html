<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PianoMagic — Аудио в ноты</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface-raised: #222;
            --border: #333;
            --text-primary: #f0f0f0;
            --text-secondary: #888;
            --text-tertiary: #555;
            --accent: #4f8ef7;
            --positive: #4caf50;
            --danger: #f44336;
            --radius: 12px;
            --radius-sm: 8px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }
        .app {
            width: 100%;
            max-width: 640px;
            background: transparent;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .header-icon {
            width: 40px;
            height: 40px;
            background: var(--surface-raised);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }
        .header h1 {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.01em;
        }
        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
        }
        .tab.active {
            background: var(--surface-raised);
            color: var(--text-primary);
            border: 1px solid var(--text-tertiary);
        }
        .tab:hover:not(.active) {
            border-color: var(--text-tertiary);
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: var(--text-tertiary);
            background: rgba(255,255,255,0.02);
        }
        .dropzone input { display: none; }
        .dropzone-icon { color: var(--text-secondary); margin-bottom: 12px; }
        .dropzone h3 { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
        .dropzone p { font-size: 13px; color: var(--text-tertiary); }
        .file-selected {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            padding: 12px;
            background: var(--surface-raised);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .file-selected svg { color: var(--accent); flex-shrink: 0; }
        .file-info { flex: 1; min-width: 0; }
        .file-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-size { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

        .url-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .url-input:focus { border-color: var(--text-tertiary); }
        .url-input::placeholder { color: var(--text-tertiary); }

        .btn-primary {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: var(--text-primary);
            color: var(--bg);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

        .processing {
            text-align: center;
            padding: 40px 20px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            margin: 0 auto 20px;
            position: relative;
        }
        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid var(--border);
            border-top-color: var(--text-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .steps {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 24px;
        }
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        .step-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            transition: all 0.3s;
        }
        .step.active .step-icon {
            border-color: var(--text-primary);
            color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(240,240,240,0.1);
        }
        .step.done .step-icon {
            background: var(--positive);
            border-color: var(--positive);
            color: var(--bg);
        }
        .step-label { font-size: 12px; color: var(--text-tertiary); }
        .step.active .step-label { color: var(--text-primary); }
        .step.done .step-label { color: var(--positive); }

        .result {
            text-align: center;
        }
        .result-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(76, 175, 80, 0.12);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 100px;
            color: var(--positive);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
        }
        .sheet-preview {
            background: #fff;
            border-radius: var(--radius-sm);
            padding: 32px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .sheet-title {
            color: #333;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: left;
            font-family: Georgia, serif;
        }
        .staff {
            position: relative;
            height: 80px;
            margin-bottom: 8px;
        }
        .staff-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: #333;
        }
        .note {
            position: absolute;
            width: 14px;
            height: 10px;
            background: #000;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform: rotate(-15deg);
        }
        .note::after {
            content: '';
            position: absolute;
            right: -2px;
            top: -24px;
            width: 2px;
            height: 28px;
            background: #000;
        }

        .actions {
            display: flex;
            gap: 12px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            border: 1px solid var(--border);
            text-decoration: none;
        }
        .btn-secondary {
            background: var(--surface-raised);
            color: var(--text-primary);
        }
        .btn-secondary:hover { border-color: var(--text-tertiary); }
        .btn-accent {
            background: var(--text-primary);
            color: var(--bg);
            border-color: var(--text-primary);
        }
        .btn-accent:hover { opacity: 0.9; }

        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(244, 67, 54, 0.12);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-radius: 100px;
            color: var(--danger);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<script>
const API_URL = "https://pianomagic.onrender.com";
let currentFile = null;
let activeTab = 'file';

function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('file-panel').classList.toggle('hidden', tab !== 'file');
    document.getElementById('url-panel').classList.toggle('hidden', tab !== 'url');
}

function handleFile(file) {
    if (!file) return;
    currentFile = file;
    document.getElementById('file-name').textContent = file.name;
    document.getElementById('file-size').textContent = (file.size / 1024 / 1024).toFixed(1) + ' МБ';
    document.getElementById('file-selected').classList.remove('hidden');
    document.getElementById('dropzone').classList.add('hidden');
}

function clearFile(e) {
    e.stopPropagation();
    currentFile = null;
    document.getElementById('file-input').value = '';
    document.getElementById('file-selected').classList.add('hidden');
    document.getElementById('dropzone').classList.remove('hidden');
}

const dropzone = document.getElementById('dropzone');
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('audio/')) handleFile(file);
});

function setStep(n) {
    for (let i = 1; i <= 3; i++) {
        const el = document.getElementById('step-' + i);
        el.classList.remove('active', 'done');
        if (i < n) el.classList.add('done');
        if (i === n) el.classList.add('active');
    }
}

function setStatus(text) {
    document.getElementById('status-text').textContent = text;
}

async function startTranscription() {
    if (activeTab === 'file' && !currentFile) {
        alert('Выберите аудиофайл');
        return;
    }
    if (activeTab === 'url') {
        alert('Загрузка по ссылке пока недоступна. Используйте файл.');
        return;
    }

    document.getElementById('panel-input').classList.add('hidden');
    document.getElementById('panel-processing').classList.remove('hidden');
    document.getElementById('panel-result').classList.add('hidden');
    document.getElementById('panel-error').classList.add('hidden');

    setStep(1);
    setStatus('Загрузка файла...');

    try {
        const formData = new FormData();
        formData.append("file", currentFile);

        setStep(2);
        setStatus('AI анализирует аудио...');

        const response = await fetch(`${API_URL}/transcribe/file`, {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.detail || `Ошибка сервера: ${response.status}`);
        }

        const data = await response.json();

        setStep(3);
        setStatus('Генерация нот...');

        setTimeout(() => showResult(data), 800);

    } catch (err) {
        console.error(err);
        showError(err.message || 'Не удалось обработать файл');
    }
}

function showResult(data) {
    document.getElementById('panel-processing').classList.add('hidden');
    document.getElementById('panel-result').classList.remove('hidden');

    const name = currentFile ? currentFile.name.replace(/\.[^.]+$/, '') : 'Transcription';
    document.getElementById('sheet-title').textContent = name + ' — Piano Solo';

    // Устанавливаем ссылку на скачивание
    const downloadBtn = document.getElementById('download-btn');
    if (data.pdf_url) {
        downloadBtn.href = `${API_URL}${data.pdf_url}`;
        downloadBtn.classList.remove('hidden');
    } else {
        downloadBtn.classList.add('hidden');
    }
}

function showError(message) {
    document.getElementById('panel-processing').classList.add('hidden');
    document.getElementById('panel-error').classList.remove('hidden');
    document.getElementById('error-text').textContent = message;
}

function resetApp() {
    currentFile = null;
    document.getElementById('file-input').value = '';
    document.getElementById('url-input').value = '';
    document.getElementById('file-selected').classList.add('hidden');
    document.getElementById('dropzone').classList.remove('hidden');
    document.getElementById('panel-result').classList.add('hidden');
    document.getElementById('panel-error').classList.add('hidden');
    document.getElementById('panel-input').classList.remove('hidden');
    for (let i = 1; i <= 3; i++) {
        document.getElementById('step-' + i).classList.remove('active', 'done');
    }
    document.getElementById('step-1').classList.add('active');
    setStatus('Загрузка файла');
}
</script>
