<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PianoMagic v4.1</title>
<style>
:root {
    --bg: #F5F5F7; --card: #FFFFFF; --text: #1D1D1F;
    --text2: #86868B; --accent: #007AFF; --accent2: #5856D6;
    --success: #34C759; --error: #FF3B30; --border: rgba(0,0,0,0.08);
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px; -webkit-font-smoothing: antialiased;
}
.logo-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 32px; }
.logo-svg { width: 64px; height: 64px; filter: drop-shadow(0 4px 12px rgba(0,122,255,0.25)); }
.brand { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
.tagline { font-size: 14px; color: var(--text2); margin-top: -8px; }

.card {
    width: 100%; max-width: 480px; background: var(--card);
    border-radius: 20px; box-shadow: var(--shadow); padding: 24px;
    margin-bottom: 16px;
}
.drop-zone {
    width: 100%; height: 160px; border: 2px dashed var(--border); border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; transition: all 0.3s ease; background: var(--bg);
}
.drop-zone:hover { border-color: var(--accent); background: rgba(0,122,255,0.04); }
.drop-zone input { display: none; }
.drop-icon { width: 48px; height: 48px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; }
.drop-title { font-size: 16px; font-weight: 600; }
.drop-hint { font-size: 12px; color: var(--text2); }

/* Progress */
.progress-area {
    display: none; margin-top: 20px;
}
.progress-area.active { display: block; }
.progress-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
}
.progress-label { font-size: 14px; font-weight: 500; color: var(--text); }
.progress-percent { font-size: 13px; font-weight: 600; color: var(--accent); font-family: "SF Mono", monospace; }
.progress-track {
    width: 100%; height: 6px; background: rgba(0,0,0,0.06);
    border-radius: 3px; overflow: hidden;
}
.progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 3px; width: 0%;
    transition: width 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
}

.visuals { display: none; margin-top: 20px; }
.visuals.active { display: block; }
.vis-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

#spectrogram { width: 100%; height: 160px; background: #0a0a1a; border-radius: 12px; margin-bottom: 16px; }
#staff { width: 100%; height: 180px; background: var(--bg); border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border); }

.controls { display: flex; gap: 8px; margin-top: 16px; }
.btn {
    flex: 1; padding: 14px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: all 0.2s ease; text-align: center;
}
.btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; box-shadow: 0 4px 12px rgba(0,122,255,0.3);
}
.btn-primary:hover { transform: translateY(-1px); }
.btn-secondary {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

.footer {
    margin-top: auto; padding-top: 32px; text-align: center; width: 100%; max-width: 480px;
}
.version-pill {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--card); padding: 6px 14px; border-radius: 100px;
    box-shadow: var(--shadow); font-size: 11px; color: var(--text2);
    font-family: "SF Mono", monospace;
}
</style>
</head>
<body>

<div class="logo-wrap">
    <svg class="logo-svg" viewBox="0 0 64 64" fill="none">
        <rect width="64" height="64" rx="16" fill="url(#lg)"/>
        <rect x="20" y="18" width="7" height="32" rx="2" fill="white" opacity="0.95"/>
        <rect x="37" y="22" width="7" height="28" rx="2" fill="white" opacity="0.6"/>
        <circle cx="44" cy="16" r="4" fill="white"/>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="64" y2="64"><stop stop-color="#007AFF"/><stop offset="1" stop-color="#5856D6"/></linearGradient></defs>
    </svg>
    <div class="brand">PianoMagic</div>
    <div class="tagline">FFT → Мелодия → Ноты</div>
</div>

<div class="card">
    <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="audio/*">
        <div class="drop-icon">🎵</div>
        <div class="drop-title">Загрузите аудиофайл</div>
        <div class="drop-hint">MP3 · WAV · FLAC · M4A</div>
    </div>

    <!-- Прогресс -->
    <div class="progress-area" id="progressArea">
        <div class="progress-header">
            <span class="progress-label" id="progressLabel">Загрузка...</span>
            <span class="progress-percent" id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- Визуализация -->
    <div class="visuals" id="visuals">
        <div class="vis-title">Спектрограмма (FFT, 50мс)</div>
        <canvas id="spectrogram"></canvas>

        <div class="vis-title">Извлечённая мелодия</div>
        <svg id="staff" viewBox="0 0 800 180" preserveAspectRatio="xMidYMid meet"></svg>

        <div class="controls">
            <button class="btn btn-secondary" id="btnPlay">▶️ Прослушать</button>
            <button class="btn btn-primary" id="btnRender" disabled>📄 Скачать PDF</button>
        </div>
    </div>
</div>

<div class="footer">
    <div class="version-pill">
        <span>FE <strong>4.1.1</strong></span>
        <span style="opacity:0.3">|</span>
        <span>BE <strong id="beVer">—</strong></span>
    </div>
</div>

<script>
const API = 'https://pianomagic-api.onrender.com';
let currentJobId = null;
let melodyData = null;
let fftData = null;
let audioCtx = null;

fetch(`${API}/`).then(r => r.ok ? r.json() : null).then(d => {
    if (d) document.getElementById('beVer').textContent = d.version;
});

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const progressArea = document.getElementById('progressArea');
const progressLabel = document.getElementById('progressLabel');
const progressPercent = document.getElementById('progressPercent');
const progressFill = document.getElementById('progressFill');
const visuals = document.getElementById('visuals');
const btnPlay = document.getElementById('btnPlay');
const btnRender = document.getElementById('btnRender');

function setProgress(text, percent) {
    progressLabel.textContent = text;
    progressPercent.textContent = percent + '%';
    progressFill.style.width = percent + '%';
    progressArea.classList.add('active');
}

function hideProgress() {
    progressArea.classList.remove('active');
}

dropZone.addEventListener('click', () => fileInput.click());
['dragover','dragenter'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; }));
['dragleave','drop'].forEach(e => dropZone.addEventListener(e, ev => {
    ev.preventDefault(); dropZone.style.borderColor = '';
    if (e === 'drop' && ev.dataTransfer.files.length) handleFile(ev.dataTransfer.files[0]);
}));
fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });

function handleFile(file) {
    const valid = /\.(mp3|wav|flac|m4a|ogg)$/i.test(file.name);
    if (!valid) { alert('Выберите аудиофайл'); return; }

    visuals.classList.remove('active');
    btnRender.disabled = true;
    btnPlay.textContent = '▶️ Прослушать';
    setProgress('Загрузка файла...', 5);

    const formData = new FormData();
    formData.append('file', file);

    fetch(`${API}/analyze`, { method: 'POST', body: formData })
        .then(r => r.json())
        .then(data => {
            if (data.job_id) {
                currentJobId = data.job_id;
                pollStatus(data.job_id);
            }
        })
        .catch(err => {
            setProgress('Ошибка загрузки', 0);
            alert('Ошибка загрузки: ' + err.message);
        });
}

function pollStatus(jobId) {
    const iv = setInterval(() => {
        fetch(`${API}/status/${jobId}`)
            .then(r => r.json())
            .then(data => {
                setProgress(data.stage_text || 'Обработка...', data.progress || 0);

                if (data.status === 'analyzed') {
                    clearInterval(iv);
                    hideProgress();
                    loadMelody(jobId);
                } else if (data.status === 'failed') {
                    clearInterval(iv);
                    setProgress('Ошибка: ' + (data.error || 'unknown'), 0);
                }
            });
    }, 1500);
}

function loadMelody(jobId) {
    fetch(`${API}/melody/${jobId}`)
        .then(r => r.json())
        .then(data => {
            melodyData = data.melody;
            fftData = data.fft;
            visuals.classList.add('active');
            drawSpectrogram(fftData);
            drawStaff(melodyData);
            btnRender.disabled = false;
        });
}

function drawSpectrogram(frames) {
    const canvas = document.getElementById('spectrogram');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.scale(dpr, dpr);

    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, w, h);

    if (!frames || frames.length === 0) return;

    const barW = w / frames.length;
    frames.forEach((f, i) => {
        const amp = Math.max(0, Math.min(1, f.amp || 0));
        const bright = Math.pow(amp, 0.5) * 100;
        const hue = 200 + amp * 60;
        ctx.fillStyle = `hsl(${hue}, 90%, ${bright}%)`;
        const bh = Math.max(2, amp * h * 0.9);
        ctx.fillRect(i * barW, h - bh, Math.max(1, barW - 0.5), bh);
    });
}

function drawStaff(notes) {
    const svg = document.getElementById('staff');
    svg.innerHTML = '';
    const w = 800, h = 180;
    const lineY = [50, 65, 80, 95, 110];

    lineY.forEach(y => {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '60'); line.setAttribute('y1', y);
        line.setAttribute('x2', w - 10); line.setAttribute('y2', y);
        line.setAttribute('stroke', '#1D1D1F'); line.setAttribute('stroke-width', '1.2');
        svg.appendChild(line);
    });

    const clef = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    clef.setAttribute('x', '15'); clef.setAttribute('y', '95');
    clef.setAttribute('font-size', '42'); clef.setAttribute('font-family', 'serif');
    clef.textContent = '𝄞';
    svg.appendChild(clef);

    if (!notes || notes.length === 0) return;

    const totalTime = notes.reduce((s, n) => s + n.dur, 0) * 1.2;
    const xScale = (w - 80) / Math.max(totalTime, 4);
    let x = 70;

    const midiToY = (midi) => 110 - (midi - 60) * 3.5;

    notes.forEach((n, i) => {
        const y = midiToY(n.pitch);
        const noteW = Math.max(20, n.dur * xScale * 0.8);

        const note = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
        note.setAttribute('cx', x + noteW / 2); note.setAttribute('cy', y);
        note.setAttribute('rx', noteW / 2); note.setAttribute('ry', '5');
        note.setAttribute('fill', '#1D1D1F');
        svg.appendChild(note);

        const stemDir = y > 80 ? -1 : 1;
        const stem = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        stem.setAttribute('x1', x + noteW - 2); stem.setAttribute('y1', y);
        stem.setAttribute('x2', x + noteW - 2); stem.setAttribute('y2', y + stemDir * 30);
        stem.setAttribute('stroke', '#1D1D1F'); stem.setAttribute('stroke-width', '1.5');
        svg.appendChild(stem);

        if (n.pitch >= 77) {
            for (let ly = 50; ly > y; ly -= 15) {
                const ll = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                ll.setAttribute('x1', x); ll.setAttribute('y1', ly);
                ll.setAttribute('x2', x + noteW); ll.setAttribute('y2', ly);
                ll.setAttribute('stroke', '#1D1D1F'); ll.setAttribute('stroke-width', '0.8');
                svg.appendChild(ll);
            }
        }
        if (n.pitch <= 56) {
            for (let ly = 110; ly < y; ly += 15) {
                const ll = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                ll.setAttribute('x1', x); ll.setAttribute('y1', ly);
                ll.setAttribute('x2', x + noteW); ll.setAttribute('y2', ly);
                ll.setAttribute('stroke', '#1D1D1F'); ll.setAttribute('stroke-width', '0.8');
                svg.appendChild(ll);
            }
        }

        x += noteW + 8;
    });
}

function playMelody() {
    if (!melodyData || melodyData.length === 0) return;
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const now = audioCtx.currentTime;
    let t = now;

    melodyData.forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const freq = 440 * Math.pow(2, (n.pitch - 69) / 12);

        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + n.dur * 0.9);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + n.dur);

        t += n.dur;
    });

    btnPlay.textContent = '⏸️ Остановить';
    setTimeout(() => { btnPlay.textContent = '▶️ Прослушать'; }, (t - now) * 1000);
}

btnPlay.addEventListener('click', () => {
    if (audioCtx && audioCtx.state === 'running') {
        audioCtx.suspend();
        btnPlay.textContent = '▶️ Прослушать';
    } else {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume();
        playMelody();
    }
});

btnRender.addEventListener('click', () => {
    if (!currentJobId) return;
    btnRender.disabled = true;
    btnRender.textContent = '⏳ Рендер...';

    fetch(`${API}/render/${currentJobId}`, { method: 'POST' })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'completed') {
                window.location.href = `${API}/download/${currentJobId}.pdf`;
                btnRender.textContent = '📄 Скачать PDF';
                btnRender.disabled = false;
            } else {
                throw new Error('Render failed');
            }
        })
        .catch(err => {
            alert('Ошибка рендера: ' + err.message);
            btnRender.textContent = '📄 Скачать PDF';
            btnRender.disabled = false;
        });
});
</script>
</body>
</html>
